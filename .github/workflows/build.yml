name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Derle
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
          echo ${PIPESTATUS[0]} > status.txt
          exit 0
      - name: APK ve kaydi 'apk' dalina koy
        shell: bash
        run: |
          mkdir out
          cp build.log status.txt out/
          cp app/build/outputs/apk/debug/app-debug.apk out/AcademiaOS.apk 2>/dev/null || true
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Sonuc
        shell: bash
        run: test "$(cat status.txt)" = "0"
